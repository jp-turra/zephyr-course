CONFIG_GPIO=y
CONFIG_LOG=y

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n          # opcional, desabilite se não for usar

# WiFi
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# DHCP (pra pegar IP do seu roteador em modo Station)
CONFIG_NET_DHCPV4=y

# Driver específico do CYW43/airoc
CONFIG_CYW43439=y
CONFIG_GPIO_CYW43=y

# Sockets (necessário pro servidor HTTP)
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# USB Console configuration
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y